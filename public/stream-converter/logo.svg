<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="scGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF0066" />
      <stop offset="55%" stop-color="#FF4D88" />
      <stop offset="100%" stop-color="#FFC2A0" />
    </linearGradient>
  </defs>

  <!-- Outer Black 3D Shadow Offset Layers -->
  <g fill="#000000" transform="translate(6, 12)">
    <text x="12" y="142" font-family="'Arial Black', 'Impact', sans-serif" font-size="112" font-weight="900" letter-spacing="-3">S.C</text>
  </g>
  <g fill="#000000" transform="translate(4, 8)">
    <text x="12" y="142" font-family="'Arial Black', 'Impact', sans-serif" font-size="112" font-weight="900" letter-spacing="-3">S.C</text>
  </g>
  <g fill="#000000" transform="translate(2, 4)">
    <text x="12" y="142" font-family="'Arial Black', 'Impact', sans-serif" font-size="112" font-weight="900" letter-spacing="-3">S.C</text>
  </g>

  <!-- Heavy Black Outline -->
  <text x="12" y="142" font-family="'Arial Black', 'Impact', sans-serif" font-size="112" font-weight="900" letter-spacing="-3" fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">S.C</text>

  <!-- Inner Vibrant Gradient Fill -->
  <text x="12" y="142" font-family="'Arial Black', 'Impact', sans-serif" font-size="112" font-weight="900" letter-spacing="-3" fill="url(#scGradient)" stroke="#000000" stroke-width="3" stroke-linejoin="round">S.C</text>
</svg>
