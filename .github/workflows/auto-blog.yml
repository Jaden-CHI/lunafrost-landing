name: Auto Blog Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '주제 (비우면 공식 자료를 검색해서 선정)'
        required: false
      category:
        description: 'AI Tools / App Dev / Content / Tech Trends'
        required: false
      dry_run:
        description: '설정과 테스트만 확인 (글 생성 및 공개 없음)'
        type: boolean
        default: false

concurrency:
  group: blog-draft
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check daily publication slot
        id: daily
        run: node scripts/check-daily-post.mjs
      - name: Generate post and select local stock cover
        if: steps.daily.outputs.skip != 'true' && inputs.dry_run != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_TOPIC: ${{ inputs.topic }}
          BLOG_CATEGORY: ${{ inputs.category }}
          PUBLISH_ON_MERGE: 'true'
          AUTO_PUBLISH: 'true'
        run: node scripts/generate-post.mjs
      - name: Validate content
        if: steps.daily.outputs.skip != 'true' || inputs.dry_run == true
        run: npm run test:blog
      - name: Verify production build
        if: steps.daily.outputs.skip != 'true' || inputs.dry_run == true
        run: npm run build
      - name: Publish validated article
        if: steps.daily.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          git config user.name 'lunafrost-bot'
          git config user.email 'bot@moonyth.app'
          git add content/blog/ public/images/posts/
          git commit -m 'Publish daily researched blog post'
          git pull --rebase origin main
          npm run test:blog
          git push origin HEAD:main
          echo 'Article committed to main. Vercel deployment must succeed before it is live: https://moonyth.app/blog' >> "$GITHUB_STEP_SUMMARY"
      - name: Skipped publication
        if: steps.daily.outputs.skip == 'true' || inputs.dry_run == true
        run: echo 'No new article published (daily slot already used or dry run requested).' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve generated files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blog-recovery
          path: |
            recovery/
            content/blog/
            public/images/posts/
          retention-days: 7
