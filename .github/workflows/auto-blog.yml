name: Auto Blog Generator

on:
  schedule:
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:
    inputs:
      topic:
        description: '주제 (비우면 공식 자료를 검색해서 선정)'
        required: false
      category:
        description: 'AI Tools / App Dev / Content / Tech Trends'
        required: false

concurrency:
  group: blog-draft
  cancel-in-progress: false

jobs:
  draft-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check pending review
        id: pending
        run: |
          COUNT=$(gh pr list --state open --limit 100 --json headRefName --jq '[.[] | select(.headRefName | startswith("blog/draft-"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" != 0 ]; then
            echo 'A blog draft is awaiting review. Skipped to avoid duplicate drafts and API costs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.pending.outputs.count == '0'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.pending.outputs.count == '0'
      - name: Generate researched post and local cover
        if: steps.pending.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_API_SECRET: ${{ secrets.HIGGSFIELD_API_SECRET }}
          BLOG_TOPIC: ${{ inputs.topic }}
          BLOG_CATEGORY: ${{ inputs.category }}
          PUBLISH_ON_MERGE: 'true'
        run: node scripts/generate-post.mjs
      - name: Validate draft
        if: steps.pending.outputs.count == '0'
        run: npm run test:blog
      - name: Create review PR
        if: steps.pending.outputs.count == '0'
        run: |
          BRANCH="blog/draft-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name 'lunafrost-bot'
          git config user.email 'bot@moonyth.app'
          git add content/blog/ public/images/posts/
          git commit -m 'Add researched blog post for review'
          git push origin "$BRANCH"
          URL=$(gh pr create --base main --head "$BRANCH" --title 'Blog draft: review before publishing' --body 'Review official sources, factual claims, code examples and the local cover. This repository is public: the PR text is publicly visible. The post is published on moonyth.app only after merging this PR and successful deployment. No automatic merge is configured.')
          echo "Review PR: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve generated files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blog-draft-recovery
          path: |
            recovery/
            content/blog/
            public/images/posts/
          retention-days: 7
